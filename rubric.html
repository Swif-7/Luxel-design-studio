<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rubric — Luxel</title><meta name="description" content="用滑块和取色整理配色与字重，一键复制成可直接交给 agent 的 UI 设计规范。"><meta name="theme-color" content="#ffffff"><link rel="icon" href="/favicon.svg?v=3"><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/rubric.css"><script>try{var t=localStorage.getItem("rheo-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body>
<header><a class="brand" href="/" aria-label="返回 Luxel 首页"><svg class="brand-mark" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><rect x="12" y="12" width="20" height="20"/><rect x="32" y="12" width="20" height="20" fill-opacity=".62"/><rect x="12" y="32" width="20" height="20" fill-opacity=".38"/><rect x="32" y="32" width="20" height="20" fill-opacity=".16"/></svg> Luxel <span class="brand-sub">RUBRIC · UI SPEC</span></a><div class="header-right"><span id="audit-summary" class="audit"></span><button id="theme" aria-label="切换深浅模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button></div></header>

<main>
<h1 class="sr-only">Rubric — 为 agent 生成 UI 设计规范</h1>

<div class="board">
<section class="sheet" id="light-sheet"><header><h2>浅色</h2><span id="light-state" class="sheet-state"></span></header><div id="light-rows" class="rows"></div></section>
<div class="linkbar"><span class="wire"></span><button id="link" aria-pressed="true" aria-label="深色随浅色自动规划"><span aria-hidden="true">⇄</span></button><span class="wire"></span><span id="link-label" class="link-label"></span></div>
<section class="sheet" id="dark-sheet"><header><h2>深色</h2><span id="dark-state" class="sheet-state"></span></header><div id="dark-rows" class="rows"></div></section>
</div>

<section class="console">
<div class="group"><h3>模式</h3>
<div class="segment" role="radiogroup" aria-label="配色模式">
<button class="seg" data-mode="mono" role="radio" aria-checked="true">单色</button>
<button class="seg" data-mode="duo" role="radio" aria-checked="false">双色</button>
<button class="seg" data-mode="multi" role="radio" aria-checked="false">多色</button>
</div>
<label class="count-row" id="count-row" hidden for="count">强调色数量<input id="count" type="number" min="2" max="6" step="1" value="3"></label>
</div>

<div class="group grow"><h3>强调色 <span id="harmony-slot"></span></h3>
<div id="accents" class="accents"></div>
<div id="recommend" class="recommend" hidden><span class="rec-label">推荐</span><div id="rec-list" class="rec-list"></div></div>
</div>

<div class="group"><h3>中性色</h3><div id="neutral-controls" class="stack"></div></div>
<div class="group"><h3>字重与字阶</h3><div id="type-controls" class="stack"></div></div>

<div class="group actions"><h3>导出</h3>
<button id="copy" class="primary">⧉ &nbsp; 复制规范 <span>MD</span></button>
<button id="reset" class="ghost">重置</button>
</div>
</section>

<section class="sheet type-sheet"><header><h2>字体</h2><span class="sheet-state" id="type-state"></span></header><div id="type-rows" class="type-strip"></div></section>
</main>
<div id="toast" role="status"></div>
<script type="module" src="/src/rubric.js"></script>
</body></html>
