<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rubric — Luxel</title><meta name="description" content="用滑块和取色整理配色与字重，一键复制成可直接交给 agent 的 UI 设计规范。"><meta name="theme-color" content="#ffffff"><link rel="icon" href="/favicon.svg?v=3"><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/rubric.css"><script>try{var t=localStorage.getItem("rheo-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body>
<header><a class="brand" href="/" aria-label="返回 Luxel 首页"><svg class="brand-mark" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><rect x="12" y="12" width="20" height="20"/><rect x="32" y="12" width="20" height="20" fill-opacity=".62"/><rect x="12" y="32" width="20" height="20" fill-opacity=".38"/><rect x="32" y="32" width="20" height="20" fill-opacity=".16"/></svg> Luxel <span class="brand-sub">RUBRIC · UI SPEC</span></a>
<nav id="steps" class="steps" aria-label="步骤"></nav>
<div class="header-right"><div id="audit-wrap" class="audit-wrap"><button id="audit-summary" class="audit" aria-expanded="false" aria-controls="audit-panel"></button><section id="audit-panel" class="audit-panel" aria-label="检查与建议详情" tabindex="0" hidden></section></div><button id="reset" type="button" class="ghost head-reset" title="恢复全部默认设置">重置</button><button id="theme" aria-label="切换深浅模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button><button id="copy" class="primary header-copy" title="复制当前浅深配色与字体规范"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M12 4V3H3v9h1"/></svg>复制规范</button></div></header>

<main>
<h1 class="sr-only">Rubric — 为 agent 生成 UI 设计规范</h1>

<!-- 舞台：中间只放「结果」。前两步是浅深两块实况预览，第三步是字样，第四步是完整 token 明细。 -->
<section id="stage" class="stage" aria-live="polite">
  <div class="pane previews" data-for="0 1">
    <figure class="pv-col" id="pv-light-col"><figcaption>浅色<span id="pv-light-state"></span></figcaption>
      <div class="ui" id="pv-light" aria-label="浅色预览">
        <div class="ui-bar"><span class="ui-logo"></span><b>Acme</b><span class="ui-accents"></span><small>v2.1</small></div>
        <div class="ui-card"><span class="ui-meta">03 · 设计规范</span><h3 class="ui-h">设计规范 Design Spec</h3>
          <p class="ui-p">正文用 --text，次级说明用 --text-2，<strong>重点用强调字重</strong>。</p>
          <div class="ui-row"><span class="ui-btn">主操作</span><span class="ui-btn2">次要</span><span class="ui-tag">标签</span></div></div>
        <div class="ui-row"><span class="ui-input">输入框占位文字</span><code class="ui-code">--accent</code></div>
      </div>
      <div class="strip" id="strip-light" aria-hidden="true"></div>
    </figure>
    <figure class="pv-col" id="pv-dark-col"><figcaption>深色<span id="pv-dark-state"></span></figcaption>
      <div class="ui" id="pv-dark" aria-label="深色预览">
        <div class="ui-bar"><span class="ui-logo"></span><b>Acme</b><span class="ui-accents"></span><small>v2.1</small></div>
        <div class="ui-card"><span class="ui-meta">03 · 设计规范</span><h3 class="ui-h">设计规范 Design Spec</h3>
          <p class="ui-p">正文用 --text，次级说明用 --text-2，<strong>重点用强调字重</strong>。</p>
          <div class="ui-row"><span class="ui-btn">主操作</span><span class="ui-btn2">次要</span><span class="ui-tag">标签</span></div></div>
        <div class="ui-row"><span class="ui-input">输入框占位文字</span><code class="ui-code">--accent</code></div>
      </div>
      <div class="strip" id="strip-dark" aria-hidden="true"></div>
    </figure>
  </div>

  <div class="pane type-pane" data-for="2"><div id="type-rows" class="type-strip"></div></div>

  <div class="pane board" data-for="3">
    <section class="sheet" id="light-sheet"><header><h2>浅色</h2><span id="light-state" class="sheet-state"></span></header><div id="light-rows" class="rows"></div></section>
    <section class="sheet" id="dark-sheet"><header><h2>深色</h2><span id="dark-state" class="sheet-state"></span></header><div id="dark-rows" class="rows"></div></section>
  </div>
</section>

<!-- 底部面板：一次只放这一步的控件，两头是上一步 / 下一步 -->
<div id="dock" class="dock" role="group" aria-label="当前步骤的设置" data-editing-theme="light">
  <button id="prev" type="button" class="nav">‹ 上一步</button>
  <div class="ctls">
    <!-- 前两步都作用于「当前编辑的那套」配色，所以编辑对象与浅深联动放在最前 -->
    <div class="cell edit-bar" data-for="0 1">
      <span class="lab">编辑</span>
      <div class="edit-theme-switch"><button type="button" data-edit-theme="light" aria-pressed="true">浅色</button><span class="theme-track"><input id="edit-theme" type="range" min="0" max="1" step="1" value="0" aria-label="当前编辑的配色方案" aria-valuetext="浅色"></span><button type="button" data-edit-theme="dark" aria-pressed="false">深色</button></div>
      <div class="linkbar"><button id="link" aria-pressed="true" aria-label="深色随浅色自动规划"><span aria-hidden="true">⇄</span></button><span id="link-label" class="link-label"></span></div>
      <span id="edit-status" class="sr-only">浅深联动</span>
    </div>

    <div class="cell" data-for="0">
      <span class="lab">模式 <span id="harmony-slot"></span></span>
      <div class="segment" role="radiogroup" aria-label="配色模式">
        <button class="seg" data-mode="mono" role="radio" aria-checked="true">单色</button>
        <button class="seg" data-mode="multi" role="radio" aria-checked="false">多色</button>
      </div>
      <div class="palette-options"><label class="count-row" id="count-row" hidden for="count"><span>数量</span><input id="count" type="number" min="2" max="6" step="1" value="3"></label>
        <label class="policy-row" for="accent-policy"><span class="sr-only">颜色处理</span><span class="select-row"><select id="accent-policy"><option value="auto">自动适配</option><option value="original">保留原色</option></select></span></label></div>
    </div>
    <div class="cell" data-for="0">
      <span class="lab">强调色</span>
      <div id="accents" class="accents"></div>
      <p id="policy-note" class="sr-only"></p>
    </div>
    <div class="cell" data-for="0">
      <div id="recommend" class="recommend" hidden>
        <p id="rec-note" class="sr-only"></p>
        <div class="rec-group"><span class="rec-label" id="contrast-label" title="跨色相搭配；接近黑白灰时提供稳定的彩色点缀">对比色</span><div id="rec-list" class="rec-list" role="group" aria-labelledby="contrast-label"></div></div>
        <div class="rec-group"><span class="rec-label" id="tonal-label" title="同一色系的深浅变化">同色阶</span><div id="tonal-list" class="rec-list" role="group" aria-labelledby="tonal-label"></div></div>
      </div>
      <p id="mono-hint" class="hint">单色只有一个强调色；切到「多色」可获得搭配推荐。</p>
    </div>

    <div class="cell" data-for="1">
      <span class="lab">主体背景 <span id="background-warning"></span></span>
      <div class="background-controls"><label class="background-picker" title="自定义主体背景色"><input id="background-color" type="color" aria-label="主体背景色"></label><input id="background-hex" type="text" aria-label="主体背景色 HEX" maxlength="7" spellcheck="false"><button id="background-reset" type="button">默认</button></div>
      <div class="bg-rec"><span id="background-source" class="rec-label">随主色推荐</span><div id="background-recommend" class="rec-list" role="group" aria-label="推荐背景色"></div><button id="background-link" type="button" aria-pressed="false">跟随强调色</button></div>
      <p id="background-alert" class="sr-only" role="status" hidden></p>
    </div>
    <div class="cell surface-cell" data-for="1">
      <span class="lab">卡片<span class="lab-note">面板、卡片的底色</span></span>
      <div class="background-controls"><label class="background-picker" title="自定义卡片"><input id="card-color" type="color" aria-label="卡片"></label><input id="card-hex" type="text" aria-label="卡片 HEX" maxlength="7" spellcheck="false"><button id="card-reset" type="button" title="恢复默认的中性灰">默认</button></div>
      <div class="bg-rec"><span class="rec-label">按背景与主色推荐</span><div id="card-recommend" class="rec-list" role="group" aria-label="推荐卡片"></div></div>
    </div>
    <div class="cell surface-cell" data-for="1">
      <span class="lab">边框<span class="lab-note">分隔线、卡片描边</span></span>
      <div class="background-controls"><label class="background-picker" title="自定义边框"><input id="border-color" type="color" aria-label="边框"></label><input id="border-hex" type="text" aria-label="边框 HEX" maxlength="7" spellcheck="false"><button id="border-reset" type="button" title="恢复默认的中性灰">默认</button></div>
      <div class="bg-rec"><span class="rec-label">按背景与主色推荐</span><div id="border-recommend" class="rec-list" role="group" aria-label="推荐边框"></div></div>
    </div>
    <div class="cell" data-for="2"><div id="text-contrast" class="neutral-row"></div></div>
    <div class="cell" data-for="2">
      <span class="lab">字体</span>
      <button id="type-link" aria-pressed="false">推荐联动 · 关</button>
    </div>
    <div class="cell" data-for="2"><p class="hint">每张字样卡下面就是控制它的两个滑块；打开推荐联动后，改一项会按推荐比例带动其余几项。</p></div>

    <div class="cell" data-for="3"><span class="lab">检查</span><p id="review-summary" class="review"></p></div>
    <div class="cell row" data-for="3"><button id="copy-final" type="button" class="primary">复制规范</button></div>
  </div>
  <button id="next" type="button" class="nav primary">下一步 ›</button>
</div>
</main>
<div id="toast" role="status"></div>
<dialog id="copy-fallback" aria-labelledby="copy-title"><h2 id="copy-title">手动复制规范</h2><p>浏览器未允许自动复制。下方已选中全文，可按 ⌘C / Ctrl+C 复制。</p><textarea id="copy-text" aria-label="完整设计规范" readonly></textarea><button id="close-copy">关闭</button></dialog>
<dialog id="audit-detail" aria-labelledby="audit-title"><h2 id="audit-title">检查说明</h2><p id="audit-message"></p><button id="close-audit">关闭</button></dialog>
<script type="module" src="/src/rubric.js?v=20260923-steps-3"></script>
</body></html>
