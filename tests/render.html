   {coreCount,coreChange:coreError/coreCount,edgeCount,edgeChange:edgeChange/edgeCount});
  check('Zero blur bypass remains exact: '+mode+' / '+seed+' / '+time,diff(clear,capture(0,false))===0);
 }
 // Measure actual cross-sections: one boundary should enter the pigment
 // quickly while its opposite side dissolves over a much longer distance.
 for(const mode of [0,2,3]){
  const w=360,h=360,g=edgeRenderer.gl;
  edgeRenderer.draw({...depthState,mode,scale:.55,angle:0,distortion:.6,background:'#ffffff',colors:['#2255aa','#2255aa'],backgroundTint:0,blur:0,particles:false},2,w,h);
  const pixels=new Uint8Array(w*h*4);g.readPixels(0,0,w,h,g.RGBA,g.UNSIGNED_BYTE,pixels);
  const ratios=[];let singleFront=0,profiles=0;
  for(let x=32;x<w-32;x+=16){
   const profile=Array.from({length:h},(_,y)=>255-pixels[(y*w+x)*4]);
   const peak=Math.max(...profile),center=profile.indexOf(peak);if(peak<60)continue;
   const ramp=direction=>{
    let hi=-1,lo=-1;
    for(let y=center;y>=0&&y<h;y+=direction){
     if(hi<0&&profile[y]<peak*.8)hi=y;
     if(profile[y]<peak*.2){lo=y;break;}
    }
    return hi>=0&&lo>=0?Math.abs(lo-hi):0;
   };
   const a=ramp(-1),b=ramp(1);if(a&&b){
    ratios.push(Math.max(a,b)/Math.min(a,b));profiles++;
    let reversals=0;
    for(let y=2;y<h-2;y++){
     const delta=(profile[y+1]+profile[y+2]-profile[y-1]-profile[y-2])/2;
     if(y<center-2&&delta < -3)reversals++;
     if(y>center+2&&delta > 3)reversals++;
    }
    if(reversals<=2)singleFront++;
   }
  }
  if(mode===0)check('Tide cross-sections have no secondary contour stripes',profiles>10&&singleFront/profiles>.8,{profiles,singleFront});
  check('Pigment has a single sharp front and a diffuse wake: '+mode,ratios.filter(x=>x>3).length>=2,{ratios});
 }
 check('Depth inspection leaves WebGL error-free',edgeRenderer.gl.getError()===edgeRenderer.gl.NO_ERROR);
 edgeRenderer.destroy();
 document.getElementById('results').textContent=JSON.stringify({passed:results.filter(x=>x.pass).length,total:results.length,results},null,2);
}catch(error){document.getElementById('results').textContent=error.stack;}
</script></html>
