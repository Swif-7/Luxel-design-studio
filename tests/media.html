<!doctype html><html lang="zh"><meta charset="utf-8"><title>媒体导出检查</title><style>body{font:16px system-ui;background:#171717;color:#eee}button{padding:14px;margin:8px}video{display:block;max-width:720px;width:100%}pre{white-space:pre-wrap}</style>
<h1>媒体导出检查</h1><button id="png">检查 2K / 4K PNG</button><button id="video2k">检查 10 秒 2K 视频</button><button id="video4k">检查 10 秒 4K 视频</button><button id="cancel">取消</button><pre id="results">等待检查</pre><video id="player" controls muted></video>
<script type="module">
import {exportSize,exportPng,exportVideo} from '/src/media.js';
import {defaults,hashSeed} from '/src/model.js';
const state={...defaults,mode:1,blur:60,seedValue:hashSeed(defaults.seed)%10000},results=document.querySelector('#results'),player=document.querySelector('video');
let controller,url;
const run=async task=>{document.querySelectorAll('button:not(#cancel)').forEach(b=>b.disabled=true);controller=new AbortController();try{await task();}catch(e){results.textContent=e.name+': '+e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}};
document.querySelector('#cancel').onclick=()=>controller?.abort();
document.querySelector('#png').onclick=()=>run(async()=>{const checks=[];for(const quality of [1.5,2]){const size=exportSize(quality,16,9);results.textContent='正在生成 PNG '+size.width;const blob=await exportPng({...state,quality},2,size),image=await createImageBitmap(blob);checks.push({kind:'PNG',width:image.width,height:image.height,bytes:blob.size,pass:image.width===size.width&&image.height===size.height});image.close();}results.textContent=JSON.stringify(checks,null,2);});
const event=(element,name)=>new Promise((resolve,reject)=>{const timer=setTimeout(()=>{cleanup();reject(Error(name+' 超时'));},15000);const ok=()=>{cleanup();resolve();},bad=()=>{cleanup();reject(Error('视频解码失败'));};function cleanup(){clearTimeout(timer);element.removeEventListener(name,ok);element.removeEventListener('error',bad);}element.addEventListener(name,ok,{once:true});element.addEventListener('error',bad,{once:true});});
async function video(quality){return run(async()=>{const size=exportSize(quality,16,9),start=performance.now();const blob=await exportVideo({...state,quality},2,size,{signal:controller.signal,onProgress:p=>results.textContent=`生成 ${size.width} × ${size.height}: ${Math.round(p*100)}%`});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);const ready=event(player,'loadedmetadata');player.src=url;await ready;const duration=player.duration;const canvas=document.createElement('canvas');canvas.width=160;canvas.height=90;const ctx=canvas.getContext('2d');const frames=[];for(const time of [.1,5,9.9]){const sought=event(player,'seeked');player.currentTime=time;await sought;ctx.drawImage(player,0,0,160,90);frames.push(ctx.getImageData(0,0,160,90).data);}let motion=0;for(let i=0;i<frames[0].length;i++)motion+=Math.abs(frames[0][i]-frames[2][i]);results.textContent=JSON.stringify({kind:'WebM',width:player.videoWidth,height:player.videoHeight,duration,bytes:blob.size,secondsToGenerate:(performance.now()-start)/1000,motion:motion/frames[0].length,pass:player.videoWidth===size.width&&player.videoHeight===size.height&&Math.abs(duration-10)<.002&&motion>1000},null,2);});}
document.querySelector('#video2k').onclick=()=>video(1.5);document.querySelector('#video4k').onclick=()=>video(2);
</script></html>
