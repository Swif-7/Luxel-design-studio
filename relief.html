<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relief — Luxel</title><meta name="description" content="把截图放进好看的背景：裁切、圆角、外框、阴影、画幅和文字排版，一键复制或导出，全程本地处理。"><meta name="theme-color" content="#ffffff"><link rel="icon" href="favicon.svg?v=3"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="relief.css"><script>try{var t=localStorage.getItem("rheo-theme");if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem("luxel-lang");if(!/^(zh|en|ko|ja|fr)$/.test(l||"")){l="en";for(var n=navigator.languages||[navigator.language],i=0;i<n.length;i++){var c=String(n[i]).slice(0,2).toLowerCase();if(/^(zh|en|ko|ja|fr)$/.test(c)){l=c;break}}}document.documentElement.lang={zh:"zh-CN",en:"en",ko:"ko",ja:"ja",fr:"fr"}[l];if(l!=="zh"){document.documentElement.classList.add("i18n-wait");setTimeout(function(){document.documentElement.classList.remove("i18n-wait")},1500)}}catch(e){}</script></head>
<body>
<header><a class="brand" href="./" aria-label="返回 Luxel 首页"><svg class="brand-mark" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><rect x="12" y="12" width="20" height="20"/><rect x="32" y="12" width="20" height="20" fill-opacity=".62"/><rect x="12" y="32" width="20" height="20" fill-opacity=".38"/><rect x="32" y="32" width="20" height="20" fill-opacity=".16"/></svg> Luxel <span class="brand-sub">RELIEF · SHOWCASE</span></a>
<nav id="steps" class="steps" aria-label="步骤" hidden></nav>
<div class="header-right"><label class="head-btn" id="swap-wrap" hidden>换一张<input id="swap" type="file" accept="image/*,.heic,.heif" hidden></label><button id="theme" aria-label="切换深浅模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button></div></header>

<main>
<h1 class="sr-only">Relief — 截图美化与样机</h1>
<section id="stage" class="stage">
  <label id="drop" class="drop">
    <input id="pick" type="file" accept="image/*,.heic,.heif" title="选择截图">
    <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><rect x="7.5" y="8.5" width="9" height="7" rx="1.5"/></svg></span>
    <b>粘贴截图（⌘V），或拖入 / 点击选择</b>
    <small>接下来依次：裁切 → 背景 → 构图 → 导出<br>全部在本地处理，不会上传</small>
  </label>
  <div id="crop" class="crop" hidden>
    <div id="crop-frame" class="crop-frame"><img id="crop-img" alt="待裁切的截图" draggable="false">
      <div class="crop-mask"><div id="crop-shade" class="crop-shade"></div></div>
      <div id="crop-box" class="crop-box" data-h="move">
        <i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i><i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i>
      </div>
    </div>
    <span id="crop-dims" class="crop-dims"></span>
  </div>
  <canvas id="preview" class="preview" hidden></canvas>
  <div id="text-layer" class="text-layer" hidden>
    <div class="layer-clip"><div id="text-hits"></div><div id="sel" class="sel" hidden></div><div id="guides"></div></div>
    <div id="pop" class="pop" hidden><span id="pop-label" class="pop-label"></span><input id="pop-range" type="range" aria-label="大小"><output id="pop-out"></output><button id="pop-reset" type="button" class="pop-reset" title="复位：回到默认位置和大小" aria-label="复位"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a6 6 0 1 0 1.8-4.3M4 4v3.4h3.4"/></svg></button></div>
    <textarea id="text-editor" class="text-editor" rows="1" spellcheck="false" hidden></textarea>
  </div>
  <p id="compose-hint" class="compose-hint" hidden>拖动文字或截图移动 · 点击调大小 · 双击改字</p>
</section>

<div id="dock" class="dock" role="group" aria-label="当前步骤的设置" hidden></div>
</main>

<dialog id="import-dialog" class="import-dialog">
  <form method="dialog">
    <h2>导入 Rheo 画面</h2>
    <p>在 <a href="rheo.html" target="_blank" rel="noopener">Rheo</a> 页右上角「导出」菜单里点「复制到 Relief」，回到这里按 <kbd>⌘V</kbd> 粘贴。</p>
    <label id="import-paste" class="import-paste" tabindex="0">按 ⌘V 粘贴，或点击选择 Rheo 保存的 PNG<input id="import-file" type="file" accept="image/*" title="选择 Rheo 保存的图片"></label>
    <p id="import-error" class="import-error" role="alert"></p>
    <div class="import-actions"><button value="cancel" class="ghost">取消</button></div>
  </form>
</dialog>
<div id="veil" class="veil" hidden><span>松开即可放入</span></div>
<p id="toast" class="toast" role="status" hidden></p>
<script type="module" src="src/relief.js"></script>
</body>
</html>
