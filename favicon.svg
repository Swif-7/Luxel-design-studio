<!-- Luxel 阶梯格：一个像素格，格内的光被量化。
     favicon 用三格简化版 —— 四级灰在 16px 下会糊成一团（见 docs/BRAND.md 最小尺寸）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<style>
 .bg{fill:#fff;stroke:#e5e5e5;stroke-width:2}.c{fill:#0d0d0d}
 @media(prefers-color-scheme:dark){.bg{fill:#171717;stroke:#2f2f2f}.c{fill:#ececec}}
</style>
<rect class="bg" x="1" y="1" width="62" height="62" rx="14"/>
<rect class="c" x="14" y="14" width="18" height="18"/>
<rect class="c" x="32" y="14" width="18" height="18" fill-opacity=".45"/>
<rect class="c" x="14" y="32" width="18" height="18" fill-opacity=".45"/>
</svg>
