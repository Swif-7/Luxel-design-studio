<!-- Luxel 阶梯格：一个像素格，格内的光被量化。
     16px 下用三格简化版（四级灰会糊成一团，见 docs/BRAND.md 最小尺寸）。
     底色取强调色实色而非页面底色：标签栏本身是浅灰的，白底加淡边等于隐形。
     深色模式整体反相，两种标签栏下都是高对比。
     注意：XML 注释内不得出现连续两个 ASCII 连字符，故此处不写 CSS 变量名。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<style>
 .bg{fill:#0d0d0d}.c{fill:#ffffff}
 @media(prefers-color-scheme:dark){.bg{fill:#ececec}.c{fill:#0f0f0f}}
</style>
<rect class="bg" width="64" height="64" rx="15"/>
<rect class="c" x="11" y="11" width="20" height="20"/>
<rect class="c" x="33" y="11" width="20" height="20" fill-opacity=".55"/>
<rect class="c" x="11" y="33" width="20" height="20" fill-opacity=".55"/>
</svg>
