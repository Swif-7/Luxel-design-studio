<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recast — Luxel</title><meta name="description" content="在浏览器里压缩图片、转换格式、批量缩放并打包下载，全程本地处理，不上传。"><meta name="theme-color" content="#ffffff"><link rel="icon" href="favicon.svg?v=3"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="recast.css"><script>try{var t=localStorage.getItem("rheo-theme");if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem("luxel-lang");if(!/^(zh|en|ko|ja|fr)$/.test(l||"")){l="en";for(var n=navigator.languages||[navigator.language],i=0;i<n.length;i++){var c=String(n[i]).slice(0,2).toLowerCase();if(/^(zh|en|ko|ja|fr)$/.test(c)){l=c;break}}}document.documentElement.lang={zh:"zh-CN",en:"en",ko:"ko",ja:"ja",fr:"fr"}[l];if(l!=="zh"){document.documentElement.classList.add("i18n-wait");setTimeout(function(){document.documentElement.classList.remove("i18n-wait")},1500)}}catch(e){}</script></head>
<body>
<header><a class="brand" href="./" aria-label="返回 Luxel 首页"><svg class="brand-mark" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><rect x="12" y="12" width="20" height="20"/><rect x="32" y="12" width="20" height="20" fill-opacity=".62"/><rect x="12" y="32" width="20" height="20" fill-opacity=".38"/><rect x="32" y="32" width="20" height="20" fill-opacity=".16"/></svg> Luxel <span class="brand-sub">RECAST · IMAGE</span></a>
<div class="header-right"><label class="head-btn" id="add-wrap" hidden>＋ 添加图片<input id="add" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple hidden></label><button id="clear" class="head-btn" type="button" hidden>清空</button><button id="theme" aria-label="切换深浅模式"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg></button></div></header>

<main>
<h1 class="sr-only">Recast — 图片压缩与格式转换</h1>
<section class="centre" aria-live="polite">

<label id="drop" class="drop">
  <input id="pick" title="选择图片" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple>
  <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 14.5v3A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5v-3"/></svg></span>
  <b>拖入图片，或点击选择</b>
  <small>静态 JPG · PNG · WEBP，可一次多张，也能直接粘贴<br>全部在本地处理，不会上传 · 单张 ≤64 MB / 3200 万像素</small>
</label>

<div id="single" class="single" hidden>
  <div class="single-bar"><button id="back" type="button" class="ghost" hidden>← 全部</button><span id="single-name" class="single-name"></span><span class="sp"></span><button id="prev" type="button" class="ghost icon" aria-label="上一张" hidden>‹</button><button id="next" type="button" class="ghost icon" aria-label="下一张" hidden>›</button></div>
  <div id="compare" class="cmp">
    <img id="before" alt="原图" draggable="false">
    <div class="after"><img id="after" alt="处理后" draggable="false"></div>
    <span class="line" aria-hidden="true"></span>
    <span id="tag-before" class="tag l"></span><span id="tag-after" class="tag r"></span>
    <input id="split" type="range" min="0" max="100" value="50" aria-label="对比分界位置">
  </div>
  <div class="caption"><span id="single-meta"></span><button id="single-remove" type="button" class="ghost">移除</button></div>
</div>

<div id="batch" class="batch" hidden>
  <div id="grid" class="thumbs"></div>
  <div class="sum"><span id="totals" class="totals"></span><span class="hint">点缩略图查看对比</span></div>
</div>

</section>

<div class="dock" role="group" aria-label="输出设置">
  <div class="grp"><span class="lab" id="format-label">格式</span><div id="formats" class="seg" role="radiogroup" aria-labelledby="format-label"></div></div>
  <span class="div" aria-hidden="true"></span>
  <label class="grp quality"><span class="lab">质量</span><input id="quality" type="range" min="1" max="100" value="78"><output id="quality-val" for="quality">78</output></label>
  <span class="div" aria-hidden="true"></span>
  <div class="grp"><span class="select-row"><select id="max-edge" aria-label="最长边"><option value="0">原尺寸</option><option value="3840">最长 3840</option><option value="2560">最长 2560</option><option value="1920">最长 1920</option><option value="1280">最长 1280</option><option value="800">最长 800</option></select></span>
    <div class="more-wrap"><button id="more" type="button" class="ghost" aria-expanded="false" aria-controls="more-panel">更多</button>
      <div id="more-panel" class="more-panel" hidden>
        <div class="more-row"><span>转 JPG 时透明区域</span><div class="seg small" role="radiogroup" aria-label="透明区域底色"><button type="button" role="radio" data-fill="#ffffff">白</button><button type="button" role="radio" data-fill="#000000">黑</button></div></div>
        <label class="more-row"><span>文件名加 -min 后缀</span><input id="suffix" type="checkbox" class="switch"></label>
        <p class="more-note">输出始终重新编码，不回退原文件；体积可能变大。PNG 仅转换或缩放，未接入专项压缩。原文件元数据不会主动复制，但请勿将此工具用作敏感信息清除保证。</p>
      </div>
    </div>
  </div>
  <button id="cancel" type="button" class="ghost" hidden>取消处理</button><button id="retry" type="button" class="ghost" hidden>重试未完成</button><button id="download" type="button" class="primary" disabled>下载</button>
</div>
</main>

<div id="veil" class="veil" hidden><span>松开即可添加</span></div>
<p id="toast" class="toast" role="status" hidden></p>
<script type="module" src="src/recast.js"></script>
</body>
</html>
